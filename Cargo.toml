[package]
name = "bb8-ldap"
version = "0.4.1"
edition = "2021"
authors = ["Iain H <iain@spiralpoint.org>"]
license = "MIT"
description = "A bb8 connection pool manager for ldap3 async LDAP connections"
repository = "https://github.com/iainh/bb8-ldap"
documentation = "https://docs.rs/bb8-ldap"
readme = "README.md"
keywords = ["ldap", "bb8", "pool", "async", "connection-pool"]
categories = ["asynchronous", "network-programming"]

[features]
default = ["tls-rustls-aws-lc-rs"]
tls-native = ["ldap3/tls-native"]
tls-rustls-aws-lc-rs = ["ldap3/tls-rustls-aws-lc-rs"]
tls-rustls-ring = ["ldap3/tls-rustls-ring"]

[dependencies]
bb8 = "0.9"
ldap3 = { version = "0.12", default-features = false }
url = "2"

[dev-dependencies]
anyhow = "1.0.89"
testcontainers = { version = "0.26", features = ["blocking"] }
testcontainers-modules = { version = "0.14", features = ["openldap"] }
tokio = { version = "1.49", features = ["macros", "rt-multi-thread"] }
